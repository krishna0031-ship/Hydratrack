<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>HydraTrack AI</title>
<meta name="description" content="Track water intake, lab Hb trends, body profile and style — all on your device." />

<!-- PWA metadata -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HydraTrack AI" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />

<!-- Tailwind (JIT, runtime, cached offline by the service worker after first load) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM (UMD builds — no bundler needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel Standalone transpiles the app's JSX right in the browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { background: #fafaf9; overscroll-behavior-y: none; }
  @media (prefers-color-scheme: dark) { html, body { background: #020617; } }
  #root { min-height: 100vh; }
  #boot-splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0d9488; color: white; font-family: system-ui, sans-serif; z-index: 9999; transition: opacity .3s ease;
  }
  #boot-splash .drop { font-size: 48px; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
</style>
</head>
<body>
<div id="boot-splash"><div class="drop">💧</div><div style="margin-top:8px;font-weight:700;letter-spacing:.02em;">HydraTrack AI</div></div>
<div id="root"></div>

<script>
  // ---- storage shim: gives app.jsx the same window.storage.get/set/delete/list
  // interface it already uses, backed by localStorage so data survives closing
  // the browser, closing the installed PWA, and restarting the phone.
  (function () {
    const PREFIX = "ht_";
    function safe(fn, fallback) {
      try { return fn(); } catch (e) { console.error("storage error", e); return fallback; }
    }
    window.storage = {
      async get(key) {
        return safe(() => {
          const raw = localStorage.getItem(PREFIX + key);
          if (raw === null) return null;
          return { key, value: raw, shared: false };
        }, null);
      },
      async set(key, value) {
        return safe(() => {
          localStorage.setItem(PREFIX + key, value);
          return { key, value, shared: false };
        }, null);
      },
      async delete(key) {
        return safe(() => {
          localStorage.removeItem(PREFIX + key);
          return { key, deleted: true, shared: false };
        }, null);
      },
      async list(prefix) {
        return safe(() => {
          const p = PREFIX + (prefix || "");
          const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(PREFIX.length));
          return { keys, prefix, shared: false };
        }, { keys: [], prefix, shared: false });
      },
    };
  })();

  // Hide the boot splash once React has mounted (or after a short timeout, in
  // case something goes wrong, so the user is never stuck on a blank screen).
  window.addEventListener("load", function () {
    setTimeout(function () {
      const el = document.getElementById("boot-splash");
      if (el) { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }
    }, 400);
  });

  // Register the service worker for offline support.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (err) {
        console.error("Service worker registration failed:", err);
      });
    });
  }
</script>

<!-- The app itself -->
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
